<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>لوحة التحكم</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:#fff;color:#000;max-width:560px;margin:auto;padding:16px;font-size:18px}
h1,h2{text-align:center;margin:14px 0}
input,select,button{width:100%;min-height:58px;margin:6px 0;padding:10px 14px;border-radius:14px;border:1px solid #D4A017;background:#fff;color:#000;font:inherit}
button{background:#D4A017;font-weight:700;cursor:pointer;border:0}button.red{background:#c0392b;color:#fff;min-height:48px;width:auto;padding:0 16px}
button.big{min-height:76px;font-size:24px;margin:10px 0;border-radius:20px}button.gray{background:#ddd}
.box{border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 2px 15px rgba(200,155,60,.3)}
.row{display:flex;gap:8px;align-items:center;margin:10px 0}.row img{width:60px;height:60px;border-radius:10px;object-fit:cover;background:#eee}
.row div{flex:1}.err{color:#c0392b;text-align:center;margin:8px 0}.sm{font-size:14px;color:#777}
</style></head><body>
<div id="login"><h1>دخول الأدمن</h1><input id="em" type="email" placeholder="الإيميل" autocomplete="username"><input id="pw" type="password" placeholder="الباسورد" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><button onclick="login()">دخول</button><p class="err" id="e"></p></div>
<div id="pick" hidden><h1>عايز تضيف منتج في أنهي قسم؟</h1><div id="cats"></div>
<button class="big gray" onclick="newCat()">➕ قسم جديد</button><button class="red" style="width:100%" onclick="logout()">خروج</button></div>
<div id="cpage" hidden><button class="gray" onclick="drawPick()">⬅ رجوع للأقسام</button><h1 id="ct"></h1>
<div class="box"><h2 id="ft">إضافة منتج</h2>
<input id="ne" placeholder="Product name (English)"><input id="na" placeholder="اسم المنتج بالعربي">
<input id="pr" type="number" placeholder="السعر (اختياري)">
<input id="ie" placeholder="Ingredients (English)"><input id="ia" placeholder="المكونات بالعربي">
<p class="sm">صورة المنتج (من الموبايل):</p><input id="img" type="file" accept="image/*">
<input id="iu" placeholder="أو رابط صورة (اختياري)">
<select id="av"><option value="true">متاح</option><option value="false">غير متاح</option></select>
<button class="big" id="sv" onclick="saveP()">حفظ المنتج</button><button class="gray" onclick="resetF()" id="cb" hidden>إلغاء التعديل</button></div>
<div class="box"><h2>منتجات القسم</h2><div id="plist"></div></div>
<button class="red" style="width:100%" onclick="delC()">مسح القسم ده</button></div>
<script src="config.js"></script>
<script>
const U=SB.url,K=SB.key;let D={categories:[],products:[]},cur=null,edit=null,S=JSON.parse(localStorage.sbs||'null');const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function view(v){['login','pick','cpage'].forEach(i=>$(i).hidden=i!==v)}
function setS(j){S={at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in-60)*1000};localStorage.sbs=JSON.stringify(S)}
async function token(){if(!S)throw 'x';if(Date.now()>S.exp){const r=await fetch(U+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:S.rt})});
 if(!r.ok){logout();throw 'x'}setS(await r.json())}return S.at}
async function sb(path,method,body,hdr){const t=await token();const r=await fetch(U+path,{method:method||'GET',headers:{apikey:K,Authorization:'Bearer '+t,...(body&&!(body instanceof Blob)?{'Content-Type':'application/json'}:{}),...hdr},body:body&&!(body instanceof Blob)?JSON.stringify(body):body});
 if(!r.ok){let m='';try{m=(await r.json()).message}catch(e){}if(r.status===409||/foreign key/i.test(m))alert('امسح منتجات القسم الأول');else alert('خطأ: '+(m||r.status));throw 'x'}return r}
async function load(){const H={apikey:K};const [c,p]=await Promise.all([fetch(U+'/rest/v1/categories?select=*&order=sort',{headers:H}).then(r=>r.json()),fetch(U+'/rest/v1/products?select=*&order=created_at,id',{headers:H}).then(r=>r.json())]);D={categories:c,products:p}}
async function login(){$('e').textContent='';if(K.startsWith('PASTE')){$('e').textContent='⚠️ لازم تحط الـ Publishable key في ملف config.js';return}
 let r,j;try{r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:$('em').value.trim().toLowerCase(),password:$('pw').value})});j=await r.json()}catch(e){$('e').textContent='⚠️ مفيش اتصال بالإنترنت';return}
 if(!r.ok){const raw=j.error_description||j.msg||j.message||j.error||r.status;const L=String(raw).toLowerCase();
  const hint=L.includes('invalid login')?'الإيميل أو الباسورد غلط (اتأكد من لغة الكيبورد English)':L.includes('not confirmed')?'الإيميل مش مفعّل: امسح المستخدم واعمله من جديد مع تفعيل Auto Confirm User':L.includes('api key')?'المفتاح في config.js غلط أو مش محفوظ':L.includes('disabled')?'تسجيل الدخول بالإيميل مقفول: فعّل Email من Authentication ← Sign In / Providers':'خطأ';
  $('e').textContent='⚠️ '+hint+' ['+raw+']';return}setS(j);$('pw').value='';init()}
function logout(){S=null;localStorage.removeItem('sbs');view('login')}
async function init(){if(!S||K.startsWith('PASTE'))return view('login');try{await token();await load();drawPick()}catch(e){view('login')}}
function drawPick(){view('pick');$('cats').innerHTML=D.categories.map(c=>`<button class="big" onclick="openCat('${esc(c.id)}')">${esc(c.name_ar)} · ${esc(c.name_en)}<br><span class="sm">${D.products.filter(p=>p.category===c.id).length} منتج</span></button>`).join('')}
function openCat(id){cur=id;const c=D.categories.find(x=>x.id===id);$('ct').textContent=c.name_ar+' · '+c.name_en;resetF();view('cpage');drawList();scrollTo(0,0)}
function drawList(){$('plist').innerHTML=D.products.filter(p=>p.category===cur).map(p=>`<div class="row"><img src="${esc(p.image)}"><div>${esc(p.name_ar||p.name_en)}<br><span class="sm">${p.available?'':'غير متاح'}</span></div>
 <button class="red" style="background:#D4A017;color:#000" onclick="startEdit('${esc(p.id)}')">تعديل</button><button class="red" onclick="delP('${esc(p.id)}')">مسح</button></div>`).join('')||'<p class="sm">مفيش منتجات في القسم ده لسه</p>'}
async function saveP(){const b=$('sv');if(!$('ne').value||!$('na').value){alert('اكتب الاسم بالعربي والإنجليزي');return}b.disabled=true;b.textContent='جاري الحفظ...';
 try{let img=$('iu').value.trim();const f=$('img').files[0];
  if(f){const n=Date.now()+'-'+Math.random().toString(36).slice(2,7)+(f.name.match(/\.[a-z0-9]+$/i)||['.jpg'])[0].toLowerCase();
   await sb('/storage/v1/object/products/'+n,'POST',f,{'Content-Type':f.type||'image/jpeg'});img=U+'/storage/v1/object/public/products/'+n}
  const row={category:cur,name_en:$('ne').value,name_ar:$('na').value,ing_en:$('ie').value,ing_ar:$('ia').value,price:+$('pr').value||0,available:$('av').value==='true'};
  if(img)row.image=img;
  if(edit)await sb('/rest/v1/products?id=eq.'+encodeURIComponent(edit),'PATCH',row,{Prefer:'return=minimal'});
  else await sb('/rest/v1/products','POST',{...row,image:img||''},{Prefer:'return=minimal'});
  await load();resetF();drawList();alert('✅ اتحفظ')}catch(e){}b.disabled=false;b.textContent='حفظ المنتج'}
function startEdit(id){const p=D.products.find(x=>x.id===id);edit=id;$('ne').value=p.name_en;$('na').value=p.name_ar;$('pr').value=p.price||'';
 $('ie').value=p.ing_en;$('ia').value=p.ing_ar;$('av').value=String(p.available);$('iu').value='';$('ft').textContent='تعديل منتج (الصورة بتفضل زي ما هي لو مغيرتهاش)';$('cb').hidden=false;scrollTo(0,0)}
function resetF(){edit=null;['ne','na','pr','ie','ia','img','iu'].forEach(i=>$(i).value='');$('av').value='true';$('ft').textContent='إضافة منتج';$('cb').hidden=true}
async function delP(id){if(confirm('مسح المنتج؟')){try{await sb('/rest/v1/products?id=eq.'+encodeURIComponent(id),'DELETE');await load();drawList()}catch(e){}}}
async function newCat(){const ar=prompt('اسم القسم بالعربي:');if(!ar)return;const en=prompt('Category name (English):');if(!en)return;
 try{await sb('/rest/v1/categories','POST',{id:'c'+Date.now(),name_en:en,name_ar:ar,sort:D.categories.length+1},{Prefer:'return=minimal'});await load();drawPick()}catch(e){}}
async function delC(){if(confirm('مسح القسم؟ (لازم يكون فاضي)')){try{await sb('/rest/v1/categories?id=eq.'+encodeURIComponent(cur),'DELETE');await load();drawPick()}catch(e){}}}
init()
</script></body></html>
